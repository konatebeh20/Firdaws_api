version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - config.env
    environment:
      SECRET_KEY: dev-secret-key-2026
      JWT_SECRET_KEY: dev-jwt-secret-key-2026
      # DATABASE_URL: postgresql://postgres:admin123@host.docker.internal:5433/postgres
      DATABASE_URL: postgresql://postgres:admin123@host.docker.internal:5432/postgres
    volumes:
      - .:/app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"